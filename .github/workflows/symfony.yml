name: Symfony

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # `symfony/*: *` installs the latest supported version, which is what a
        # user gets by default; the pinned entries guarantee the boundaries of
        # the supported range keep working.
        #
        # PHP 8.1 cannot run Symfony 7.4 (requires >= 8.2) and Symfony 8.0
        # requires PHP >= 8.4, so the matrix only pairs compatible versions.
        include:
          - php: '8.1'
            symfony: '6.4.*'
          - php: '8.2'
            symfony: '*'
          - php: '8.3'
            symfony: '*'
          - php: '8.4'
            symfony: '*'
          - php: '8.4'
            symfony: '8.0.*'

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: |
          composer require --no-interaction --no-update --dev \
            "symfony/config:${{ matrix.symfony }}" \
            "symfony/dependency-injection:${{ matrix.symfony }}" \
            "symfony/http-kernel:${{ matrix.symfony }}" \
            "symfony/yaml:${{ matrix.symfony }}"
          composer update --no-interaction --no-progress --prefer-dist

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Run test suite
        run: vendor/bin/phpunit -c tests/phpunit.xml --no-coverage

      - name: Run static analysis
        if: matrix.symfony == '*'
        run: vendor/bin/phpstan analyse -c tests/phpstan.neon --no-progress
